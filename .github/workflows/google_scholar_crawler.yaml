name: Get Citation Data

on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'

concurrency:
  group: google-scholar-citations
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Check published citation snapshot
        id: snapshot
        run: |
          if git fetch --no-tags --depth=1 origin google-scholar-stats && \
             git show FETCH_HEAD:gs_data.json > "$RUNNER_TEMP/gs_data.json"; then
            python google_scholar_crawler/snapshot_status.py "$RUNNER_TEMP/gs_data.json" >> "$GITHUB_OUTPUT"
          else
            echo "age_hours=-1" >> "$GITHUB_OUTPUT"
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: |
          cd ./google_scholar_crawler
          pip install -r requirements.txt

      - name: Fetch citation data
        id: citations
        if: steps.snapshot.outputs.due == 'true' || github.event_name != 'schedule'
        run: |
          cd ./google_scholar_crawler
          if timeout 120s python main.py; then
            echo "result=updated" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -eq 75 ]; then
              echo "result=temporarily_unavailable" >> "$GITHUB_OUTPUT"
            else
              exit "$result"
            fi
          fi
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          GOOGLE_SCHOLAR_TRANSLATE_ONLY: 'true'

      - name: Push to google-scholar-stats branch
        if: steps.citations.outputs.result == 'updated'
        run: |
          cd ./google_scholar_crawler/results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          if git diff --cached --quiet; then
            echo "No citation data changes to publish."
            exit 0
          fi
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force

      - name: Report delayed citation update
        if: steps.citations.outputs.result == 'temporarily_unavailable'
        run: |
          if [ "${{ steps.snapshot.outputs.stale }}" = "true" ]; then
            echo "::error::Google Scholar is rate limiting requests, and the published citation data is over 48 hours old."
            exit 1
          fi
          echo "::warning::Google Scholar is rate limiting requests. The published citation data is still recent; the next scheduled run will retry."
