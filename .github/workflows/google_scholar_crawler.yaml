name: Get Citation Data

on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'

concurrency:
  group: google-scholar-citations
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check published citation snapshot
        id: snapshot
        run: |
          set -o pipefail
          if git fetch --no-tags --depth=1 origin google-scholar-stats && \
             git show FETCH_HEAD:gs_data.json > "$RUNNER_TEMP/gs_data.json"; then
            python3 google_scholar_crawler/snapshot_status.py "$RUNNER_TEMP/gs_data.json" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'age_hours=-1\ndue=true\nstale=true\nexpired=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.snapshot.outputs.due == 'true' || github.event_name != 'schedule'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        if: steps.snapshot.outputs.due == 'true' || github.event_name != 'schedule'
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        id: citations
        if: steps.snapshot.outputs.due == 'true' || github.event_name != 'schedule'
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          # Google blocks GitHub-hosted runners, so fall back to the Wayback
          # Machine, which crawls the profile from archive.org's own network.
          GOOGLE_SCHOLAR_ROUTES: direct,translate,wayback
          PYTHONUNBUFFERED: '1'
        run: |
          cd ./google_scholar_crawler
          set +e
          timeout 8m python main.py
          status=$?
          set -e
          case "$status" in
            0)
              echo "result=updated" >> "$GITHUB_OUTPUT"
              ;;
            75|124)
              echo "result=temporarily_unavailable" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$status"
              ;;
          esac

      - name: Push to google-scholar-stats branch
        if: steps.citations.outputs.result == 'updated'
        run: |
          cd ./google_scholar_crawler/results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          if git diff --cached --quiet; then
            echo "No citation data changes to publish."
            exit 0
          fi
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force

      - name: Report delayed citation update
        if: steps.citations.outputs.result == 'temporarily_unavailable'
        env:
          AGE_HOURS: ${{ steps.snapshot.outputs.age_hours }}
          STALE: ${{ steps.snapshot.outputs.stale }}
          EXPIRED: ${{ steps.snapshot.outputs.expired }}
        run: |
          if [ "$EXPIRED" = "true" ]; then
            echo "::error::Google Scholar could not be reached through any route, and the published citation data is more than 7 days old (${AGE_HOURS}h)."
            exit 1
          fi
          if [ "$STALE" = "true" ]; then
            echo "::warning::Google Scholar could not be reached through any route; the published citation data is ${AGE_HOURS}h old. The next scheduled run will retry."
          else
            echo "::notice::Google Scholar could not be reached through any route; the published citation data is still recent (${AGE_HOURS}h old). The next scheduled run will retry."
          fi
